name: Deploy Notion Home to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'notion-home/**'
      - '.github/workflows/deploy-notion-home-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Apply mobile access fix
        run: cat ./notion-home/mobile-overrides.css >> ./notion-home/styles.css

      - name: Prepare Keats Home assets
        run: |
          mkdir -p ./notion-home/assets
          cp ./visual-bible/previews/Keats_visual_lock_preview_v1.jpg ./notion-home/assets/Keats_avatar.jpg
          cp ./visual-bible/previews/Keats_design_sheet_preview_v1.jpg ./notion-home/assets/Keats_design_sheet.jpg
          sed -i 's#../visual-bible/previews/Keats_visual_lock_preview_v1.jpg#./assets/Keats_avatar.jpg#g' ./notion-home/index.html
          sed -i 's#../visual-bible/previews/Keats_design_sheet_preview_v1.jpg#./assets/Keats_design_sheet.jpg#g' ./notion-home/index.html
          sed -i 's#前端样板 · API 待接入#Notion 已接入 · Worker 守门#g' ./notion-home/index.html
          sed -i "s#window.open(node.dataset.openUrl, '_blank', 'noopener');#window.location.href = node.dataset.openUrl;#g" ./notion-home/app.js

      - name: Install hidden-room enhancements
        run: |
          cat ./notion-home/enhancements.css >> ./notion-home/styles.css
          cat ./notion-home/album-upload.css >> ./notion-home/styles.css
          cat ./notion-home/reader-enhancements.css >> ./notion-home/reader.css
          python - <<'PY'
          from pathlib import Path
          index = Path('./notion-home/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('<script src="./app.js"></script>', '<script src="./app.js"></script>\n  <script src="./enhancements.js"></script>\n  <script src="./album-upload.js"></script>')
          index.write_text(text, encoding='utf-8')

          reader = Path('./notion-home/reader.html')
          text = reader.read_text(encoding='utf-8')
          text = text.replace('<script src="./reader.js"></script>', '<script src="./reader.js"></script>\n  <script src="./reader-enhancements.js"></script>')
          reader.write_text(text, encoding='utf-8')

          enhancer = Path('./notion-home/enhancements.js')
          text = enhancer.read_text(encoding='utf-8')
          text = text.replace('    draw(0);', '    const firstFilled = ordered.findIndex(section => section.images.length || section.notes.length);\n    draw(firstFilled >= 0 ? firstFilled : 0);')
          enhancer.write_text(text, encoding='utf-8')
          PY

      - name: Upload Notion Home
        uses: actions/upload-pages-artifact@v4
        with:
          path: './notion-home'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
