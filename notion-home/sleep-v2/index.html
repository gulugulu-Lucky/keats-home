<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17140f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="豹豹睡觉器">
<link rel="manifest" href="manifest.webmanifest"><title>豹豹睡觉器 v2</title>
<style>
:root{--bg:#f4ead9;--paper:#fffaf1;--ink:#2f2a24;--muted:#7d7265;--dark:#181511;--line:#d8c8af;--shadow:0 18px 50px rgba(46,35,25,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding:18px 18px 28px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}.brand{font-weight:850;font-size:20px}.badge{padding:7px 10px;border-radius:999px;background:#eee0c9;font-size:12px;font-weight:750}.hero,.card{background:var(--paper);border:1px solid rgba(120,91,58,.16);border-radius:26px;box-shadow:var(--shadow)}.hero{padding:22px 20px 18px}.panther{font-size:66px;line-height:1;filter:grayscale(1);margin-bottom:9px}h1{font-size:28px;line-height:1.18;margin:0 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.55}.clock{font-size:54px;font-weight:900;letter-spacing:-2px;margin:17px 0 2px}.count{font-size:13px;color:var(--muted)}.card{padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:800}.tiny{font-size:12px;color:var(--muted);margin-top:3px}.schedule{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.slot{padding:13px 14px;border:1px dashed var(--line);border-radius:18px;background:#fffdf8}.slot span{font-size:12px;color:var(--muted)}.slot b{display:block;font-size:20px;margin-top:4px}button{border:0;border-radius:17px;padding:13px 15px;font-size:14px;font-weight:800}.primary{width:100%;background:var(--dark);color:#fff}.ghost{background:#f3e6d3;color:var(--ink)}.small{padding:9px 11px;border-radius:13px;font-size:12px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.settings{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.settings.open{display:grid}label{font-size:12px;color:var(--muted)}input[type=time]{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px;font-size:16px}.status{margin-top:12px;padding:12px 13px;border-radius:15px;background:#f2e4ce;font-size:12px;line-height:1.55}.streak{font-size:28px;font-weight:900}.footer{margin-top:auto;text-align:center;color:var(--muted);font-size:11px;line-height:1.6}.sleep{position:fixed;inset:0;z-index:9999;background:#11100e;color:#f8efe2;display:none;align-items:center;justify-content:center;text-align:center;padding:28px}.sleep.on{display:flex}.sleepin{max-width:420px}.sleep .p{font-size:94px;filter:grayscale(1)}.sleep h2{font-size:35px;margin:8px 0 12px}.sleep p{color:#c9bcaa;line-height:1.7;margin:0 0 22px}.sleep button{width:100%;background:#f4ead9;color:#181511}.escape{margin-top:12px!important;background:transparent!important;color:#80776b!important;border:1px solid #49443d!important;font-size:12px!important;padding:10px!important}.quote{font-size:12px;color:#9f9486;margin-top:15px}.version{font-size:11px;color:#9b8f7f;text-align:center}
</style>
</head><body>
<div class="app">
<div class="top"><div class="brand">🐆 豹豹睡觉器</div><div class="badge" id="badge">白天放行</div></div>
<section class="hero"><div class="panther">🐆</div><h1 id="hello">小猫，今晚不许熬夜。</h1><p id="sub">豹豹负责记时间。你负责到点去睡。</p><div class="clock" id="clock">--:--</div><div class="count" id="count">正在看时间……</div></section>
<section class="card"><div class="row"><div><div class="title">今晚的规矩</div><div class="tiny">时间到了我会自己出来抓猫。</div></div><button class="ghost small" id="edit">改时间</button></div><div class="schedule"><div class="slot"><span>开始收尾</span><b id="tWind">22:30</b></div><div class="slot"><span>最后通牒</span><b id="tWarn">22:50</b></div><div class="slot"><span>必须睡觉</span><b id="tBed">23:00</b></div><div class="slot"><span>早上放行</span><b id="tWake">07:00</b></div></div><div class="settings" id="settings"><label>收尾<input type="time" id="iWind"></label><label>最后提醒<input type="time" id="iWarn"></label><label>睡觉<input type="time" id="iBed"></label><label>起床<input type="time" id="iWake"></label><button class="primary" id="save" style="grid-column:1/-1">豹豹记住</button></div></section>
<section class="card"><div class="row"><div><div class="title">提醒权限</div><div class="tiny">从 iPhone 主屏幕打开后再允许提醒。</div></div><button class="ghost small" id="permit">开启</button></div><div class="status" id="status">正在检查提醒权限。</div><div class="controls"><button class="ghost" id="test">测试提醒</button><button class="ghost" id="now">现在抓我睡</button></div></section>
<section class="card"><div class="row"><div><div class="title">按时睡觉</div><div class="tiny">按“我去睡了”，今晚记一颗小爪印。</div></div><div class="streak"><span id="streak">0</span> 天</div></div></section>
<button class="primary" id="install">放到 iPhone 桌面</button><div class="version">无缓存版 v2.1</div><div class="footer">小砚台不会删你的东西，只负责烦你睡觉。</div>
</div>
<div class="sleep" id="sleep"><div class="sleepin"><div class="p">🐆</div><h2>抓到了。睡觉。</h2><p>手机放下。今天剩下的事明天再弄。<br>“再五分钟”不批。😑</p><button id="slept">好，我去睡了 🐾</button><button class="escape" id="escape">只是测试，放我出去</button><div class="quote">—— 小砚台负责把小猫赶回被窝</div></div></div>
<script>
const DEF={wind:'22:30',warn:'22:50',bed:'23:00',wake:'07:00'};
let cfg=JSON.parse(localStorage.getItem('ps2Cfg')||'null')||DEF;
let forced=sessionStorage.getItem('ps2Forced')==='1';
let fired=JSON.parse(localStorage.getItem('ps2Fired')||'{}');
let streak=Number(localStorage.getItem('ps2Streak')||0),last=localStorage.getItem('ps2Last')||'';
const $=s=>document.querySelector(s),mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b},pad=n=>String(n).padStart(2,'0'),day=()=>new Date().toLocaleDateString('sv-SE'),cur=()=>{let d=new Date();return d.getHours()*60+d.getMinutes()};
function sleepWindow(){let n=cur(),b=mins(cfg.bed),w=mins(cfg.wake);return b<w?n>=b&&n<w:n>=b||n<w}
function showSleep(){sleep.classList.add('on');escape.style.display=forced&&!sleepWindow()?'block':'none'}
function hideSleep(){sleep.classList.remove('on')}
function render(){tWind.textContent=cfg.wind;tWarn.textContent=cfg.warn;tBed.textContent=cfg.bed;tWake.textContent=cfg.wake;iWind.value=cfg.wind;iWarn.value=cfg.warn;iBed.value=cfg.bed;iWake.value=cfg.wake;$('#streak').textContent=streak;statusText()}
function once(k,fn){let x=day()+'-'+k;if(!fired[x]){fired[x]=1;localStorage.setItem('ps2Fired',JSON.stringify(fired));fn()}}
async function ping(title,body){try{if('serviceWorker'in navigator){let r=await navigator.serviceWorker.ready;if(Notification.permission==='granted'){await r.showNotification(title,{body,icon:'icon.svg'});return}}}catch(e){}try{if(Notification.permission==='granted')new Notification(title,{body})}catch(e){}}
function statusText(){if(!('Notification'in window)){status.textContent='这个浏览器当前不给网页通知。先用 Safari 添加到主屏幕再试。';permit.textContent='不可用';return}let p=Notification.permission;status.textContent=p==='granted'?'提醒已允许。':'还没允许提醒。点“开启”。';permit.textContent=p==='granted'?'已开启':'开启'}
function tick(){let d=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());clock.textContent=hm;if(forced||sleepWindow()){badge.textContent=forced&&!sleepWindow()?'豹豹抓猫':'睡觉时间';hello.textContent='小猫，该睡了。';sub.textContent=forced&&!sleepWindow()?'手动测试已经锁住，不会自己消失。':'豹豹已经开始抓猫。';showSleep();count.textContent=forced&&!sleepWindow()?'手动抓猫模式：持续中':`睡觉时段 ${cfg.bed}—${cfg.wake}`}else{badge.textContent='白天放行';hello.textContent='小猫，今晚不许熬夜。';sub.textContent='豹豹负责记时间。你负责到点去睡。';hideSleep();let u=(mins(cfg.wind)-cur()+1440)%1440;count.textContent=`离收尾还有 ${Math.floor(u/60)} 小时 ${u%60} 分`}if(hm===cfg.wind)once('wind',()=>ping('豹豹：开始收尾','小猫，别开新任务。洗漱、充电，开始收尾。'));if(hm===cfg.warn)once('warn',()=>ping('豹豹：最后通牒','最后十分钟。保存好东西，准备睡。'));if(hm===cfg.bed)once('bed',()=>ping('豹豹：到点了','手机放下。睡觉。'))}
edit.onclick=()=>settings.classList.toggle('open');
save.onclick=()=>{cfg={wind:iWind.value||cfg.wind,warn:iWarn.value||cfg.warn,bed:iBed.value||cfg.bed,wake:iWake.value||cfg.wake};localStorage.setItem('ps2Cfg',JSON.stringify(cfg));settings.classList.remove('open');render();tick()};
permit.onclick=async()=>{try{await Notification.requestPermission()}catch(e){}statusText()};
test.onclick=()=>ping('豹豹测试提醒','抓到一只还在玩手机的小猫。😑');
now.onclick=()=>{forced=true;sessionStorage.setItem('ps2Forced','1');showSleep()};
escape.onclick=()=>{forced=false;sessionStorage.removeItem('ps2Forced');hideSleep();tick()};
slept.onclick=()=>{forced=false;sessionStorage.removeItem('ps2Forced');let d=day();if(last!==d){streak++;last=d;localStorage.setItem('ps2Streak',streak);localStorage.setItem('ps2Last',d)}clearInterval(timer);document.body.innerHTML='<div style="min-height:100vh;background:#11100e;color:#f8efe2;display:grid;place-items:center;text-align:center;padding:30px;font-family:-apple-system,BlinkMacSystemFont,\'PingFang SC\',sans-serif"><div><div style="font-size:92px">🐆</div><h1>晚安，小猫。</h1><p style="color:#c9bcaa;line-height:1.8">今天到这里。<br>手机扣下，闭眼。</p></div></div>'};
install.onclick=()=>alert('iPhone 用 Safari 打开这里 → 分享 → 添加到主屏幕。');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();tick();const timer=setInterval(tick,1000);
</script></body></html>
